<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How data reaches the screen</title>
  <desc id="desc">Data flows up from the API through the HTTP cache. The RemoteMediator writes it into Room, which feeds the list. Search and filters use a network PagingSource that feeds the screen directly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5C615E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="500" rx="20" fill="#F6F6F3"/>

  <rect x="240" y="40" width="200" height="56" rx="12" fill="#FFFFFF" stroke="#E3E4DF"/>
  <text x="340" y="63" text-anchor="middle" font-size="15" font-weight="600" fill="#111312">Screen</text>
  <text x="340" y="82" text-anchor="middle" font-size="12" fill="#5C615E">List, search and detail</text>

  <rect x="240" y="156" width="200" height="56" rx="12" fill="#C6F432"/>
  <text x="340" y="179" text-anchor="middle" font-size="15" font-weight="600" fill="#111312">Room</text>
  <text x="340" y="198" text-anchor="middle" font-size="12" fill="#111312">Source of truth for the list</text>

  <rect x="40" y="156" width="160" height="56" rx="12" fill="#111312"/>
  <text x="120" y="179" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">RemoteMediator</text>
  <text x="120" y="198" text-anchor="middle" font-size="12" fill="#C9CCC5">Restocks the table</text>

  <rect x="460" y="156" width="180" height="56" rx="12" fill="#111312"/>
  <text x="550" y="179" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Network PagingSource</text>
  <text x="550" y="198" text-anchor="middle" font-size="12" fill="#C9CCC5">Search and filters</text>

  <rect x="40" y="272" width="600" height="56" rx="12" fill="#C6F432"/>
  <text x="340" y="295" text-anchor="middle" font-size="15" font-weight="600" fill="#111312">OkHttp HTTP cache</text>
  <text x="340" y="314" text-anchor="middle" font-size="12" fill="#111312">Raw responses on disk, valid for 90 days</text>

  <rect x="40" y="388" width="600" height="56" rx="12" fill="#FFFFFF" stroke="#E3E4DF"/>
  <text x="340" y="411" text-anchor="middle" font-size="15" font-weight="600" fill="#111312">Rick and Morty API</text>
  <text x="340" y="430" text-anchor="middle" font-size="12" fill="#5C615E">826 characters, 20 per page, about 40 requests every 10 s</text>

  <g stroke="#5C615E" stroke-width="1.5" fill="none">
    <line x1="340" y1="388" x2="340" y2="338" marker-end="url(#arrow)"/>
    <line x1="120" y1="272" x2="120" y2="222" marker-end="url(#arrow)"/>
    <line x1="550" y1="272" x2="550" y2="222" marker-end="url(#arrow)"/>
    <line x1="200" y1="184" x2="230" y2="184" marker-end="url(#arrow)"/>
    <line x1="340" y1="156" x2="340" y2="106" marker-end="url(#arrow)"/>
    <path d="M550 156 L550 68 L450 68" marker-end="url(#arrow)"/>
  </g>

  <text x="340" y="478" text-anchor="middle" font-size="12" fill="#5C615E">Dark: who loads the data. Lime: where it is stored. Arrows follow the data.</text>
</svg>
